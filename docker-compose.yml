services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla_user
      MYSQL_PASSWORD: joomla_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network      

  joomla:
    image: joomla:latest
    restart: always
    ports:
      - 8080:80
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: joomla_user
      JOOMLA_DB_PASSWORD: joomla_password
      JOOMLA_DB_NAME: joomla
    depends_on:
      - db
    volumes:
      - joomla_data:/var/www/html
    networks:
      - app-network      
  
  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    networks:
      - app-network      

networks:
  app-network:
    driver: bridge      

volumes:
  db_data:
  joomla_data:
